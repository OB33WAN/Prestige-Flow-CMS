name: CMS file scope

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  cms-file-scope:
    name: cms-file-scope
    runs-on: ubuntu-latest
    steps:
      - name: Allow only CMS content and image uploads
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const allowed = /^(?:content\/cms\/(?:services|industries|areas)\/[^/]+\.md|assets\/cms\/[A-Za-z0-9._/-]+\.(?:png|jpe?g|webp|avif|gif))$/i;
            const rejected = files.map(file => file.filename).filter(name => !allowed.test(name));
            if (rejected.length) {
              core.setFailed(`This repo accepts agency edits only under content/cms/ and image uploads under assets/cms/. Rejected: ${rejected.join(', ')}`);
            } else if (files.length === 0) {
              core.setFailed('The pull request contains no CMS content or image changes.');
            } else {
              core.info(`Accepted ${files.length} CMS content/image file(s).`);
            }
