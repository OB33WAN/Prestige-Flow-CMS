name: CMS file scope

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  cms-file-scope:
    name: cms-file-scope
    runs-on: ubuntu-latest
    steps:
      - name: Allow only CMS content and image uploads
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const allowed = /^(?:content\/cms\/(?:current\/(?:services|industries|areas)|services|industries|areas)\/[^/]+\.md|assets\/cms\/[A-Za-z0-9._/-]+\.(?:png|jpe?g|webp|avif|gif))$/i;
            const ownerMaintenance = /^(?:\.github\/workflows\/cms-file-scope\.yml|admin\/(?:config\.yml|index\.html|preview\.js)|assets\/(?:site-config|static-site)\.js|deploy\/easypanel\/(?:configure-site-api\.mjs|create-staging-cms-archive\.ps1)|(?:README\.md|privacy\/index\.html|sitemap\.xml)|package\.json|scripts\/(?:backfill-current-page-copy\.mjs|build-cms-pages\.mjs|current-copy-fields\.mjs|import-current-cms-pages\.mjs|make-vanilla\.mjs|preview\.mjs|test-booking\.mjs|test-cms-pages\.mjs|test-static-stripe-booking\.mjs))$/i;
            const isOwner = context.payload.pull_request.author_association === 'OWNER';
            const rejected = files.map(file => file.filename).filter(name =>
              !allowed.test(name) && !(isOwner && ownerMaintenance.test(name))
            );
            if (rejected.length) {
              core.setFailed(`Agency changes are limited to CMS Markdown under content/cms/ and image uploads under assets/cms/. CMS implementation files are permitted only in owner-authored pull requests; public website, payment, email, API and server files remain protected. Rejected: ${rejected.join(', ')}`);
            } else if (files.length === 0) {
              core.setFailed('The pull request contains no CMS content or image changes.');
            } else {
              core.info(`Accepted ${files.length} CMS content/image or owner-maintenance file(s).`);
            }
