backend:
  name: github
  repo: OB33WAN/Prestige-Flow-CMS
  branch: main
  site_domain: prestigeflow.co.uk
  open_authoring: true
  base_url: https://cms-auth.prestigeflow.co.uk
  auth_endpoint: auth
  squash_merges: true

publish_mode: editorial_workflow
site_url: https://prestigeflow.co.uk
display_url: https://prestigeflow.co.uk
logo_url: /logo.jpg
media_folder: assets/cms
public_folder: /assets/cms

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: current_services
    label: Current service pages
    label_singular: Service page
    folder: content/cms/current/services
    create: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { label: SEO title, name: title, widget: string, required: true, hint: 'Keep it concise; up to 60 characters.' }
      - { label: Meta description, name: description, widget: text, required: true, hint: 'Keep the existing page description accurate and concise.' }
      - { label: Main heading (H1), name: heading, widget: string, required: true }
      - { label: Introductory copy, name: intro, widget: text, required: true }
      - { label: Service overview copy, name: service_summary, widget: text, required: true }
    description: 'These are the 7 current service pages. Copy edits update only approved text in the existing page template. Prices, pricing headings, booking/payment text, design, links, HTML, CSS and JavaScript are locked.'

  - name: current_industries
    label: Current industry pages
    label_singular: Industry page
    folder: content/cms/current/industries
    create: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { label: SEO title, name: title, widget: string, required: true, hint: 'Keep it concise; up to 60 characters.' }
      - { label: Meta description, name: description, widget: text, required: true, hint: 'Keep the existing page description accurate and concise.' }
      - { label: Main heading (H1), name: heading, widget: string, required: true }
      - { label: Introductory copy, name: intro, widget: text, required: true }
      - label: Existing editorial sections
        name: sections
        widget: list
        min: 3
        max: 3
        summary: '{{fields.heading}}'
        fields:
          - { label: Section heading, name: heading, widget: string, required: true }
          - { label: Section copy, name: body, widget: text, required: true }
    description: 'These are the 15 current industry pages. Copy edits update selected text in the existing page template. Service cards, prices, booking/payment content, design, links, HTML, CSS and JavaScript remain locked.'

  - name: current_areas
    label: Current areas overview
    label_singular: Areas overview
    folder: content/cms/current/areas
    create: false
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { label: SEO title, name: title, widget: string, required: true, hint: 'Keep it concise; up to 60 characters.' }
      - { label: Meta description, name: description, widget: text, required: true, hint: 'Keep the existing page description accurate and concise.' }
      - { label: Main heading (H1), name: heading, widget: string, required: true }
      - { label: Introductory copy, name: intro, widget: text, required: true }
    description: 'This is the current consolidated London and South East coverage page. The old individual location pages are retired and redirect here. Postcode lists, rates, travel details, design, links, HTML, CSS and JavaScript are locked.'

  - name: services
    label: New service page drafts
    label_singular: New service page
    folder: content/cms/services
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} · /services/{{slug}}/'
    fields: &page_fields
      - { label: SEO title, name: title, widget: string, required: true, hint: 'Keep it concise; up to 60 characters.' }
      - { label: URL slug, name: slug, widget: string, required: true, hint: 'Lowercase words separated by hyphens. The build checks for existing routes.' }
      - { label: Meta description, name: description, widget: text, required: true, hint: 'Write a unique 70–160 character summary.' }
      - { label: Main heading (H1), name: heading, widget: string, required: true }
      - { label: Introductory copy, name: intro, widget: text, required: true, hint: 'Explain the service clearly and locally; at least 100 characters.' }
      - { label: Hero image, name: hero_image, widget: image, required: false }
      - { label: Hero image alt text, name: hero_image_alt, widget: string, required: false, hint: 'Required when a hero image is selected. Describe what is visible.' }
      - label: Page sections
        name: sections
        widget: list
        min: 3
        summary: '{{fields.heading}}'
        fields:
          - { label: Section heading, name: heading, widget: string, required: true }
          - { label: Section copy, name: body, widget: markdown, required: true, hint: 'Give useful, specific information. Each section needs at least 100 characters.' }
      - label: Related internal links
        name: internal_links
        widget: list
        required: false
        summary: '{{fields.label}} → {{fields.url}}'
        fields:
          - { label: Link text, name: label, widget: string, required: true }
          - { label: Site path, name: url, widget: string, required: true, hint: 'Use an internal path such as /services/cctv-surveys/.' }
    description: 'Create a new SEO landing page only when it does not duplicate one of the current service pages. Prices, canonical URLs, redirects, payment terms, design and structured data are controlled by the site owner.'

  - name: industries
    label: New industry page drafts
    label_singular: New industry page
    folder: content/cms/industries
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} · /industries/{{slug}}/'
    fields: *page_fields
    description: 'Create a new SEO landing page only when it does not duplicate one of the current industry pages. Do not promise response times, accreditations or service levels unless verified.'

  - name: areas
    label: New area page drafts
    label_singular: Area page
    folder: content/cms/areas
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} · /areas/{{slug}}/'
    fields: *page_fields
    description: 'No individual area pages are currently active: those URLs were retired and redirected to the Areas overview. Create a new area page only with the owner’s approval; avoid thin pages that only swap a place name.'
